{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div style="max-width:420px;margin:0 auto">
  <h1>Log in</h1>
  <form method="post" class="card">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field"><label for="email">Email</label><input id="email" type="email" name="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" name="password" required></div>
    <button class="btn" type="submit" style="width:100%">Log in</button>
    <p class="meta">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
  <p class="meta">Demo accounts, password <code>Passw0rd!</code>: user@venuebook.test and admin@venuebook.test</p>
</div>
{% endblock %}
